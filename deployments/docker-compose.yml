services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: service-template
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: service-template
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service-template"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://service-template:dev-only-password@postgres:5432/service-template?sslmode=disable"
      - "up"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  otel-collector:
    image: otel/opentelemetry-collector:0.106.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC

  service-template:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SERVICE_NAME: service-template
      LOG_LEVEL: debug
      GRPC_PORT: "50051"
      METRICS_PORT: "9090"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: service-template
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: service-template
      POSTGRES_SSLMODE: disable
      KAFKA_BROKERS: kafka:9092
      OUTBOX_TOPIC: service-template.events
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "50051:50051"
      - "9090:9090"

  outbox-relay:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/outbox-relay"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SERVICE_NAME: service-template
      LOG_LEVEL: debug
      METRICS_PORT: "9091"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: service-template
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: service-template
      POSTGRES_SSLMODE: disable
      KAFKA_BROKERS: kafka:9092
      OUTBOX_TOPIC: service-template.events
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "9091:9091"

volumes:
  postgres-data:
