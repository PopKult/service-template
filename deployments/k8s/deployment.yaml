apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
  labels:
    app: service-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-template
  template:
    metadata:
      labels:
        app: service-template
    spec:
      terminationGracePeriodSeconds: 30 # > SHUTDOWN_TIMEOUT (default 20s)
      containers:
        - name: service-template
          image: ghcr.io/popkult/service-template:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: service-template-config
            - secretRef:
                name: service-template-secrets
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            # Liveness MUST NOT check downstream dependencies (§5.4) — it
            # only confirms the process itself is alive and not
            # deadlocked. TCP connect on the metrics port is enough; it
            # does not use the health service (that's readiness's job).
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-template
spec:
  selector:
    app: service-template
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-template-config
data:
  SERVICE_NAME: service-template
  LOG_LEVEL: info
  GRPC_PORT: "50051"
  METRICS_PORT: "9090"
  SHUTDOWN_TIMEOUT: 20s
  POSTGRES_HOST: service-template-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: service-template
  POSTGRES_SSLMODE: require
  KAFKA_BROKERS: kafka.kafka.svc.cluster.local:9092
  OUTBOX_TOPIC: service-template.events
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
---
# Placeholder only — real deployments seal this with Bitnami Sealed
# Secrets (§6) and commit the resulting SealedSecret manifest instead of
# this. Never commit a real Secret with plaintext data.
apiVersion: v1
kind: Secret
metadata:
  name: service-template-secrets
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
