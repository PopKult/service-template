# Run before rolling out a new Deployment revision (e.g. as a Helm/Argo
# pre-upgrade hook, or a manual `kubectl apply` + wait step in CI). The
# app itself MUST NOT auto-run migrations on startup — concurrent
# replicas would race (§7).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: service-template-migrate-
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          envFrom:
            - configMapRef:
                name: service-template-config
            - secretRef:
                name: service-template-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            # Populated by CI from the migrations/ directory at image
            # build time — see .github/workflows/ci.yml.
            name: service-template-migrations
