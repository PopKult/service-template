# Minimal local dev collector: receives OTLP and just logs it, so
# `docker compose up` works standalone without a real Elastic APM /
# Prometheus backend configured. Point the exporters at real backends
# for anything beyond local dev.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
